<div class="book-list-container">
  <div class="book-list-container__button">
    <button class="book-list-container__button-adding-new-book" (click)="onOpenBookFormModal()">
      Add book
    </button>
  </div>
  <div class="book-list-container__list">
    @for (book of books(); track book.id) {
      <app-book-card
        [book]="book"
        [withRedirectToDetailsButton]="true"
        (viewDetailsButtonClicked)="onViewDetailsButtonClick($event)"
      />
    } @empty {
      <div class="book-list-container__empty">The list of the books are empty!</div>
    }
  </div>
</div>

<app-book-form
  [isOpen]="isBookFormOpen()"
  [editedBook]="editedBook()"
  (closeModal)="onCloseModal()"
  (saveBook)="onSaveBook($event)"
/>
